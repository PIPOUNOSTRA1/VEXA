<svg width="800" height="1000" viewBox="0 0 800 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Glow & Studio Lighting -->
  <rect width="800" height="1000" fill="#040507"/>
  <circle cx="400" cy="500" r="380" fill="#10B981" fill-opacity="0.16" filter="blur(100px)"/>
  <ellipse cx="400" cy="850" rx="300" ry="40" fill="#000000" fill-opacity="0.8" filter="blur(20px)"/>

  <!-- Bottle Drop Shadow -->
  <ellipse cx="400" cy="820" rx="160" ry="25" fill="#000000" fill-opacity="0.9" filter="blur(15px)"/>

  <!-- Main Glass Bottle Body -->
  <g id="aura-3d-bottle" filter="drop-shadow(0px 30px 60px rgba(0, 0, 0, 0.95))">
    
    <!-- Outer Heavyweight Glass Body -->
    <rect x="250" y="320" width="300" height="480" rx="40" fill="#0E1F17" stroke="#10B981" stroke-width="4"/>
    
    <!-- Glass Refraction Side Highlight -->
    <rect x="260" y="330" width="20" height="460" rx="10" fill="#FFFFFF" fill-opacity="0.15"/>
    <rect x="520" y="330" width="15" height="460" rx="8" fill="#FFFFFF" fill-opacity="0.08"/>

    <!-- Inner Emerald Liquid Reservoir -->
    <rect x="280" y="360" width="240" height="420" rx="28" fill="url(#liquid_gradient)"/>

    <!-- Golden Dropper Neck Ring -->
    <rect x="330" y="270" width="140" height="50" rx="10" fill="url(#gold_gradient)" stroke="#F59E0B" stroke-width="2"/>
    <rect x="340" y="310" width="120" height="12" rx="4" fill="#B45309"/>

    <!-- Rubber Dropper Top -->
    <path d="M 360 270 C 360 190 440 190 440 270 Z" fill="#1C1D24" stroke="#374151" stroke-width="2"/>
    
    <!-- Glass Pipette Tip inside Top -->
    <rect x="390" y="140" width="20" height="60" rx="10" fill="#FFFFFF" fill-opacity="0.3"/>

    <!-- Embossed Luxury Label (Center) -->
    <rect x="290" y="440" width="220" height="260" rx="16" fill="#07090C" stroke="url(#gold_gradient)" stroke-width="3"/>

    <!-- Gold Foil Border Pattern -->
    <rect x="298" y="448" width="204" height="244" rx="12" fill="none" stroke="#D97706" stroke-width="1" stroke-dasharray="6 4"/>

    <!-- Label Brand Typography -->
    <text x="400" y="520" font-family="'Syne', sans-serif" font-weight="800" font-size="32" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">AURA</text>
    <text x="400" y="550" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="14" fill="#D97706" text-anchor="middle" letter-spacing="4">BOTANICA</text>
    
    <line x1="330" y1="575" x2="470" y2="575" stroke="#D97706" stroke-width="1.5"/>

    <text x="400" y="605" font-family="sans-serif" font-weight="bold" font-size="11" fill="#10B981" text-anchor="middle" letter-spacing="1">100% ORGANIC BOTANICAL ELIXIR</text>
    <text x="400" y="625" font-family="sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">COLD-PRESSED BEAUTY SERUM</text>
    
    <text x="400" y="665" font-family="sans-serif" font-weight="bold" font-size="12" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">50 ML / 1.7 FL. OZ.</text>
  </g>

  <!-- Color Gradients -->
  <defs>
    <linearGradient id="liquid_gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#059669" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#044E37" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="gold_gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
  </defs>
</svg>
